# Linux で VOICEROID+ と ebyroid を wine 上で動かす
# 使い方は README の「Docker (Linux / wine)」を参照
# 新しい版にするときは docker compose pull && docker compose up -d
services:
  ebyroid:
    # 既定では GHCR に公開しているイメージを使う（docker compose pull で更新）。--build を付けると手元でビルドする
    # 開発用の複製では .env で EBYROID_IMAGE=ebyroid-wine:dev にして、本番のイメージを上書きしないようにする
    # 前の版に戻すときは EBYROID_IMAGE=ghcr.io/ebycow/ebyroid-wine:<コミット ID>
    image: ${EBYROID_IMAGE:-ghcr.io/ebycow/ebyroid-wine:latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    init: false # tini をイメージ側で使う
    # ログのローテーション (最大 10MB x 5 ファイル)。変更したら docker compose up -d で反映
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # デフォルト話者のワーカーが応答できるか。外部監視 (Better Stack) へのハートビートもこれを見る
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://127.0.0.1:4090/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
      start_interval: 5s
    environment:
      EBYROID_PORT: 4090
      # ワーカー数の上限。デフォルト話者は常駐し、ほかの話者は必要なときに 1 話者 1 ワーカーで起動する
      # (1 にすると 1 プロセスで話者を切り替える従来の動き)
      EBYROID_WORKERS: ${EBYROID_WORKERS:-3}
      # デフォルト以外の話者のワーカーを止めるまでの無通信時間 (ms, 0 で止めない)
      EBYROID_WORKER_IDLE_TIMEOUT_MS: ${EBYROID_WORKER_IDLE_TIMEOUT_MS:-600000}
    ports:
      - "${EBYROID_HOST_PORT:-4090}:4090"
    volumes:
      # Windows からコピーした VOICEROID+ インストールディレクトリ (Aoi, KiritanEX などを含む)
      # 既定ではリポジトリ直下の AHS/ (git 管理外) を使う
      - ${VOICEROID_DIR:-./AHS/VOICEROID+}:/voiceroid:ro
      # 話者設定。編集したら docker compose restart で反映
      - ${EBYROID_CONFIG:-./docker/ebyroid.conf.json}:/etc/ebyroid/ebyroid.conf.json:ro
