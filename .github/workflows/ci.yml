# PR と master への push で lint とテストを回す
# master では、テストが通ったときだけ GHCR へイメージを公開する
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22: 今の実行環境 (wine 上の win-x86 node.exe と同じ系列)
        # 24: API 側を 64bit 化したときの想定
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json

      # package.json の os/arch (win32/ia32) チェックと、cmake-js による install ビルドは飛ばす
      - run: npm ci --ignore-scripts --force --no-audit --no-fund

      - run: npm run lint

      - run: npm test

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
