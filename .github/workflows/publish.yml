# wine で動かすイメージを GHCR に公開する
# VOICEROID のライブラリは含めない（使う人がマウントする）
# master では ci.yml がテストを通してから呼ぶ。手動でも実行できる
name: Publish image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ebycow/ebyroid-wine
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      # wine の 32bit を使うため amd64 のみ
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # どのワークフロー・コミットから作られたか (provenance) と、中身の一覧 (SBOM) を添付する
          provenance: mode=max
          sbom: true
