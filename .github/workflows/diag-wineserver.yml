# 診断用: arm64 のイメージのビルドが GitHub の ARM ランナーで終わらない原因を調べる (Ebycow/ebyroid#7)
# (#8 の診断は run 43989988126 / 43991301343 で済んだ)
# このブランチへの push でだけ動く。原因が分かったらワークフローごと消す
name: Diagnose arm64 build

on:
  push:
    branches: [diag/ubuntu26-wineserver]

permissions:
  contents: read

jobs:
  arm64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Host
        run: |
          uname -a
          getconf PAGESIZE
          nproc
          free -h
          lscpu | grep -E 'Model name|Vendor|Flags' | cut -c1-200
          docker version --format '{{.Server.Version}}'

      # docker ドライバーでビルドするので、RUN の中のプロセスはホストの ps に見える
      - name: Build with plain progress (gives up after 20 minutes)
        run: |
          set +e
          DOCKER_BUILDKIT=1 docker build --progress=plain --platform linux/arm64 \
            -f docker/Dockerfile -t ebyroid-wine:diag . > build.log 2>&1 &
          pid=$!
          for i in $(seq 1 40); do
            sleep 30
            kill -0 "$pid" 2>/dev/null || break
            echo "--- $((i * 30))s: $(tail -n 1 build.log | cut -c1-200)"
          done
          if kill -0 "$pid" 2>/dev/null; then
            echo "::warning::build still running after 20 minutes"
            echo "::group::processes"
            ps -eo pid,ppid,etime,time,stat,args --forest | grep -vE '\[.*\]$' | cut -c1-220 | tail -n 80
            echo "::endgroup::"
            kill "$pid"
          fi
          wait "$pid"; echo "build exit=$?"
          echo "::group::build log (last 150 lines)"
          tail -n 150 build.log
          echo "::endgroup::"
