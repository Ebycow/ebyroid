# 診断用: arm64 のイメージのビルドが GitHub の ARM ランナーで終わらない原因を調べる (Ebycow/ebyroid#7)
# wineboot の RUN で xvfb-run と Xvfb が CPU 0 のまま止まり、wine は起動していなかった (run 43994741622)
# ここでは wine を使わず、xvfb-run / Xvfb だけで再現するかを見る
# このブランチへの push でだけ動く。原因が分かったらワークフローごと消す
name: Diagnose arm64 build

on:
  push:
    branches: [diag/ubuntu26-wineserver]

permissions:
  contents: read

jobs:
  xvfb:
    name: xvfb (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      - name: Host
        run: |
          uname -a
          docker version --format '{{.Server.Version}}'
          systemctl show docker containerd -p LimitNOFILE

      - name: Build small images with Xvfb
        run: |
          for d in trixie bookworm; do
            printf 'FROM debian:%s-slim\nRUN apt-get update && apt-get install -y --no-install-recommends xvfb xauth strace procps && rm -rf /var/lib/apt/lists/*\n' "$d" |
              docker build -q -t "xvfb:$d" -
          done

      # 結果はすべて表示し、ステップ自体は落とさない
      - name: xvfb-run under different settings
        run: |
          try() {
            name=$1; shift
            echo "::group::$name"
            start=$(date +%s)
            docker run --rm "$@" sh -c 'echo "nofile=$(ulimit -n)/$(ulimit -Hn)"; timeout 60 xvfb-run -a sh -c "echo XVFB_OK"; echo "exit=$?"' || true
            echo "took $(( $(date +%s) - start ))s"
            echo "::endgroup::"
          }
          for d in trixie bookworm; do
            try "$d default" "xvfb:$d"
            try "$d nofile=1024" --ulimit nofile=1024:1024 "xvfb:$d"
            try "$d init" --init "xvfb:$d"
          done

      # Xvfb を直接起動し、どこで止まるかを strace で見る
      - name: strace Xvfb startup (trixie)
        run: |
          docker run --rm --cap-add SYS_PTRACE xvfb:trixie sh -c '
            timeout 20 strace -f -tt -o /tmp/st Xvfb :5 -screen 0 1280x1024x24 -nolisten tcp > /tmp/x.log 2>&1
            echo "Xvfb exit=$?"; cat /tmp/x.log
            echo "--- last 40 syscalls"; tail -n 40 /tmp/st | cut -c1-200
            echo "--- blocking calls"; grep -nE "futex|poll|select|epoll_wait|read\(|connect|getrandom|nanosleep" /tmp/st | tail -n 15 | cut -c1-200
          ' || true
