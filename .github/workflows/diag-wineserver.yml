# 診断用: arm64 のイメージのビルドが GitHub の ARM ランナーで終わらない原因を調べる (Ebycow/ebyroid#7)
# wineboot の RUN で xvfb-run と Xvfb が CPU 0 のまま止まり、wine は起動していなかった (run 43994741622)
# docker run では xvfb-run は止まらない (run 43997527121)。docker build の RUN で、
# SHELL を bash -o pipefail にしたときだけ止まるのかを見る
# このブランチへの push でだけ動く。原因が分かったらワークフローごと消す
name: Diagnose arm64 build

on:
  push:
    branches: [diag/ubuntu26-wineserver]

permissions:
  contents: read

jobs:
  xvfb-in-build:
    name: xvfb in docker build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    steps:
      # 1 つの RUN が止まっても先へ進めるよう、docker build ごとに 90 秒で打ち切る
      - name: xvfb-run in RUN with different shells
        run: |
          try() {
            name=$1 base=$2 shell=$3 run=$4
            echo "::group::$name"
            {
              echo "FROM debian:$base-slim"
              echo "RUN apt-get update && apt-get install -y --no-install-recommends xvfb xauth procps && rm -rf /var/lib/apt/lists/*"
              [ -n "$shell" ] && echo "SHELL $shell"
              echo "RUN $run"
            } > "Dockerfile.$name"
            cat "Dockerfile.$name" | tail -n 2
            start=$(date +%s)
            timeout 90 docker build --no-cache --progress=plain -f "Dockerfile.$name" . 2>&1 | grep -E 'XVFB_OK|PID1=|SigIgn|SigCgt|ERROR|DONE' | tail -n 8
            echo "result: exit=${PIPESTATUS[0]} took $(( $(date +%s) - start ))s"
            echo "::endgroup::"
          }
          # PID 1 とそのシグナルの状態も出す (SigIgn に USR1 = bit 10 (0x200) が立つと trap できない)
          probe='grep -E "^Sig(Ign|Cgt)" /proc/self/status; echo PID1=$(cat /proc/1/cmdline | tr "\0" " ")'
          for base in trixie bookworm; do
            try "$base-sh"            "$base" ""                                     "xvfb-run -a sh -c 'echo XVFB_OK'"
            try "$base-bash-pipefail" "$base" '["/bin/bash", "-o", "pipefail", "-c"]' "xvfb-run -a sh -c 'echo XVFB_OK'"
            try "$base-bash-probe"    "$base" '["/bin/bash", "-o", "pipefail", "-c"]' "$probe; xvfb-run -a sh -c 'echo XVFB_OK'"
            try "$base-sh-probe"      "$base" ""                                     "$probe; xvfb-run -a sh -c 'echo XVFB_OK'"
          done
